# 潮信 · 构建并部署到 Cloudflare Workers 静态资源
# 需要在仓库 Settings → Secrets 里配置：CLOUDFLARE_API_TOKEN（Workers Scripts:Edit 权限）、CLOUDFLARE_ACCOUNT_ID
# main 分支推送才部署；其它分支只构建（确认页面能生成）
name: deploy
on:
  push:
    branches: [main, design/m0-mockups]
    paths: ['web/**', 'data/**', 'scripts/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: node ../scripts/compliance-scan.mjs
      - name: 同步设计稿与数据（有 data/live 就用真实数据，否则用示例）
        env: { CX_DATA_DIR: "${{ hashFiles('data/live/archive.json') != '' && 'data/live' || 'data/samples' }}" }
        run: node ../scripts/sync-web.mjs
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: web/dist, retention-days: 3 }
      - name: deploy
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
