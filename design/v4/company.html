  <div class="nav-right"><a class="btn accent" href="index.html#subscribe">免费订阅</a></div>
</header>

<div class="co">
  <aside class="co-side">
    <div class="co-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="coSearch" placeholder="搜索代码或公司名"></div>
    <div class="co-legend"><span><i style="background:var(--violet)"></i>期权信号</span><span><i style="background:var(--sky)"></i>研报</span><span><i style="background:var(--amber)"></i>新闻</span></div>
    <div class="co-list" id="coList"></div>
  </aside>

  <main class="co-main">
    <section class="card co-head" id="coHead"></section>
    <section class="card co-block"><canvas id="blockCanvas"></canvas><div class="cb-cap"><b id="blockCap">街区</b>这家公司在产业镇上的位置 · 点旁边的楼可以串门 · <a href="index.html#island">去镇上看 →</a></div></section>

    <section class="co-3d">
      <div class="card star"><canvas id="starCanvas"></canvas><div class="st-labels" id="starLabels"></div>
        <div class="c3-cap"><b>信息星图</b>拖动旋转 · 鼠标放上去看详情 · 点上下游公司可以跳转</div></div>
    </section>

    <section class="card line-wrap">
      <div class="ph"><h3>近 60 日：行情 + 事件</h3><span class="disclaimer">紫色管子 = CP 比 · 蓝色半透明带 = 研报目标价区间 · 小旗：<b style="color:var(--violet)">期</b> 期权日报 <b style="color:var(--sky)">研</b> 研报日报 <b style="color:var(--amber)">闻</b> 新闻</span></div>
      <div class="line"><canvas id="lineCanvas"></canvas></div>
    </section>

    <section class="co-grid">
      <div class="card pane" id="pOpt"></div>
      <div class="card pane" id="pRep"></div>
      <div class="card pane" id="pNews"></div>
      <div class="card pane" id="pSeen"></div>
      <div class="card pane wide" id="pChain"></div>
    </section>

    <footer class="footer">
      <div><div class="warn">本站内容为公开信息整理，不构成任何投资建议。市场有风险，投资需谨慎。</div>期权数据：每日成交前 100 · 研报：机构公开报告摘要 · 消息：公司公告、主流媒体 · 行情延迟 · 徽标仅用于识别</div>
      <div style="margin-left:auto;text-align:right">本页所有数字均为虚构示例<br>上下游关系为示意</div>
    </footer>
  </main>
</div>
<div class="card pop" id="coTip" style="position:fixed;width:auto;max-width:300px;padding:10px 14px;pointer-events:none;font-size:13px;line-height:1.6"></div>
