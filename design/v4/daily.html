  <nav class="nav-links"><a href="index.html">首页</a><a href="index.html#island">产业镇</a><a href="company.html">公司档案</a><a href="stock.html">看盘</a><a class="on" href="daily.html">日报归档</a></nav>
  <div class="nav-right"><a class="btn accent" href="index.html#subscribe">免费订阅</a></div>
</header>

<div class="ar">
  <aside class="ar-side">
    <div class="seg-ctl ar-cols" id="colSeg">
      <button data-col="eve" class="on">期权日报</button><button data-col="rr">研报日报</button><button data-col="week">周报</button><button data-col="morn">盘前汇总<em>即将上线</em></button>
    </div>
    <section class="card ar-cal">
      <div class="cal-h"><button type="button" id="calPrev" title="上个月">‹</button><b id="calTitle"></b><button type="button" id="calNext" title="下个月">›</button></div>
      <div class="cal-g" id="calGrid"></div>
      <div class="cal-legend" id="calLegend"></div>
    </section>
    <section class="card ar-replay">
      <div class="rp-h"><b>时间回放</b><span id="rpDate"></span></div>
      <div class="rp-bars" id="rpBars"></div>
      <input type="range" id="rpRange" min="0" max="0" value="0" aria-label="选择日期">
      <div class="rp-ctl"><button class="btn accent" type="button" id="rpPlay">▶ 播放</button>
        <div class="seg-ctl sm" id="rpSpeed"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
        <span class="disclaimer">每格一个交易日，右边的内容和环节热度会跟着翻页；← → 也能翻</span></div>
    </section>
    <section class="card ar-stat" id="rpStat"></section>
  </aside>

  <main class="ar-main">
    <section class="card ar-head" id="arHead"></section>
    <section class="card ar-heat" id="arHeat"></section>
    <section id="arBody"></section>
    <footer class="footer">
      <div><div class="warn">本站内容为公开信息整理，不构成任何投资建议。市场有风险，投资需谨慎。</div>期权日报署名 KZG 期权 Pro · 研报日报只放摘要，不放原文 · 周报的方向与"持续信号"按固定规则由代码汇总</div>
      <div style="margin-left:auto;text-align:right">设计稿：归档里的所有日期、数字和公司动态均为虚构示例<br>正式版由每日 pipeline 生成静态 JSON</div>
    </footer>
  </main>
</div>
